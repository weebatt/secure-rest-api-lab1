name: Secure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-sast:
    name: Tests and SAST (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          verify-signature: true

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Ddependency-check.skip=true

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Upload application for DAST
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/secure-rest-api-1.0.0.jar
          if-no-files-found: error

      - name: Run SpotBugs SAST
        run: ./mvnw --batch-mode --no-transfer-progress spotbugs:spotbugs spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: |
            target/reports/spotbugs.html
            target/spotbugs.xml
            target/spotbugsXml.xml
          if-no-files-found: warn

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          verify-signature: true

      - name: Calculate daily cache key
        id: cache-date
        shell: bash
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check database
        uses: actions/cache@v6
        with:
          path: .dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${NVD_API_KEY}" ]]; then
            echo "::error::Repository secret NVD_API_KEY is required for a complete SCA update"
            exit 1
          fi
          ./mvnw --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            "-DdataDirectory=${GITHUB_WORKSPACE}/.dependency-check-data" \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DconnectionTimeout=30000 \
            -DreadTimeout=120000

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn

  dast:
    name: DAST (ZAP baseline)
    needs: test-and-sast
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout DAST policy
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          verify-signature: true

      - name: Download tested application
        uses: actions/download-artifact@v8
        with:
          name: application-jar
          path: application

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "APP_DEFAULT_USERNAME=ci-dast-user" >> "$GITHUB_ENV"
          echo "APP_DEFAULT_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_URL=jdbc:h2:mem:secure-api-dast;DB_CLOSE_DELAY=-1" >> "$GITHUB_ENV"

      - name: Start application and wait until ready
        shell: bash
        run: |
          nohup java -jar application/secure-rest-api-1.0.0.jar > application.log 2>&1 &
          echo "$!" > application.pid
          for attempt in {1..60}; do
            if curl --silent --show-error --output /dev/null --max-time 2 http://127.0.0.1:8080/auth/login; then
              exit 0
            fi
            sleep 1
          done
          cat application.log
          exit 1

      - name: Run passive ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: -a -I
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast-application-log
          path: application.log
          if-no-files-found: warn

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [[ -f application.pid ]]; then
            kill "$(cat application.pid)" || true
          fi
